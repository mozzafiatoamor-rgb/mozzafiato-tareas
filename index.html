<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12403f">
<title>Mozzafiato · Tareas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1c2622; --muted:#6b7770;
  --line:#e6e0d4; --brand:#12403f; --brand2:#1c605d; --gold:#c8a24a;
  --ok:#1f9d63; --okbg:#e6f5ec; --warn:#c9503b; --warnbg:#fbeae6;
  --tm:#2b6cb0; --tv:#7a5cc0; --shadow:0 2px 10px rgba(20,40,38,.07);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --card:#161d1b; --ink:#eef2ef; --muted:#9fb0a8;
    --line:#26302d; --brand:#1c605d; --brand2:#2a807c; --gold:#d8b45e;
    --okbg:#123120; --warnbg:#3a1c16; --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.4;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.hidden{display:none !important}
.container{max-width:640px;margin:0 auto;padding:16px}

/* Header */
header.top{
  position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)
}
header.top .logo{width:30px;height:30px;flex:0 0 auto}
header.top .ttl{font-size:17px;font-weight:800;letter-spacing:.3px}
header.top .sub{font-size:11px;opacity:.8;margin-top:-2px}
header.top .spacer{flex:1}
header.top .chip{background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
header.top .chip button{color:#fff;opacity:.85;font-size:12px}

/* Cards / sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:22px 4px 8px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.fr{background:#eef1ef;color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.fr{background:#20302d}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#3a2c07}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
.btn.danger{background:var(--warnbg);color:var(--warn)}

/* Turno toggle */
.turno-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.turno-toggle button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.turno-toggle button.active[data-t="TM"]{background:var(--tm);color:#fff}
.turno-toggle button.active[data-t="TV"]{background:var(--tv);color:#fff}

/* Area tabs */
.area-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.area-scroll::-webkit-scrollbar{display:none}
.area-tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.area-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Task rows */
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .check{width:30px;height:30px;flex:0 0 auto;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:transparent;background:var(--card)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task .body{flex:1;min-width:0}
.task .name{font-weight:600;font-size:15px}
.task.done .name{text-decoration:line-through;color:var(--muted)}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.task .cam{width:40px;height:40px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card)}
.task .cam.has{background:var(--okbg);border-color:var(--ok)}
.subhead{padding:9px 14px;background:linear-gradient(0deg,var(--line),transparent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2)}
/* Secciones plegables */
details.sec{border-bottom:1px solid var(--line)}
details.sec:last-child{border-bottom:none}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 14px;background:linear-gradient(0deg,var(--line),transparent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{margin-left:auto;transition:transform .2s;font-size:13px;opacity:.7}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>summary .cnt{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
details.sec>summary .cnt.full{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
/* Barra flotante de envío */
.sendbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.sendbar button{pointer-events:auto;background:#25D366;color:#08351b;font-weight:800;border-radius:14px;padding:13px 18px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.22);width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;gap:8px}

/* Progress */
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--ok));border-radius:999px;transition:width .3s}

/* Bottom nav */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;color:var(--muted);font-size:9.5px;font-weight:600;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabbar button.active{color:var(--brand)}
nav.tabbar button.active .ic{transform:translateY(-1px)}
nav.tabbar .ic{font-size:20px;line-height:1}

/* Inputs */
label.fld{display:block;margin:12px 0}
label.fld > span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}

/* Login */
.login-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:16px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.person{padding:16px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center;box-shadow:var(--shadow)}
.person .av{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.person .rl{font-size:11px;color:var(--muted)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:8px auto}
.pinpad button{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:700}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pindots i.on{background:var(--brand)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px;max-height:90dvh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .grab{width:40px;height:4px;background:var(--line);border-radius:999px;margin:0 auto 12px}
@media(min-width:641px){.modal-bg{align-items:center}.modal{border-radius:20px}}

/* Toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* Evidence gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gal .ev{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.gal .ev img{width:100%;height:104px;object-fit:cover;display:block}
.gal .ev .cap{padding:6px 7px;font-size:10.5px;line-height:1.25}
.gal .ev .cap b{display:block;font-size:11px}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.stat:last-child{border:none}
.stat .num{font-weight:800;font-size:16px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.banner{background:var(--okbg);border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.banner.demo{background:#fff6e0;border-color:var(--gold);color:#8a6d18}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner.demo{background:#2c2410;color:var(--gold)}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap">
  <div style="text-align:center">
    <svg class="logo" width="56" height="56" viewBox="0 0 64 64" style="margin:0 auto" aria-hidden="true">
      <g fill="#12403f">
        <path d="M32 6c3 6 3 12 0 18-3-6-3-12 0-18z"/>
        <path d="M32 24c-4-5-9-8-15-9 2 7 7 12 15 14 8-2 13-7 15-14-6 1-11 4-15 9z" opacity=".85"/>
        <path d="M14 26c-3 5-4 11-3 17 6-2 10-7 12-13-3-1-6-2-9-4z" opacity=".6"/>
        <path d="M50 26c3 5 4 11 3 17-6-2-10-7-12-13 3-1 6-2 9-4z" opacity=".6"/>
      </g>
    </svg>
    <h1 style="font-size:26px;margin-top:8px">Mozzafiato</h1>
    <div class="muted" style="font-size:13px">Gestor de tareas y bitácoras</div>
  </div>
  <div id="loginStep1">
    <div class="section-title">¿Quién eres?</div>
    <div id="peopleList" class="people"></div>
  </div>
  <div id="loginStep2" class="hidden" style="text-align:center">
    <div id="whoAv" class="person av" style="margin:0 auto 6px"></div>
    <div id="whoName" style="font-weight:800;font-size:18px"></div>
    <div class="muted" style="font-size:13px;margin-bottom:6px">Ingresa tu PIN</div>
    <div class="pindots"><i></i><i></i><i></i><i></i></div>
    <div class="pinpad" id="pinpad"></div>
    <button class="btn ghost" style="max-width:260px;margin:10px auto 0" onclick="App.backToPeople()">← Cambiar usuario</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#ffffff">
        <path d="M32 6c3 6 3 12 0 18-3-6-3-12 0-18z"/>
        <path d="M32 24c-4-5-9-8-15-9 2 7 7 12 15 14 8-2 13-7 15-14-6 1-11 4-15 9z" opacity=".85"/>
        <path d="M14 26c-3 5-4 11-3 17 6-2 10-7 12-13-3-1-6-2-9-4z" opacity=".6"/>
        <path d="M50 26c3 5 4 11 3 17-6-2-10-7-12-13 3-1 6-2 9-4z" opacity=".6"/>
      </g>
    </svg>
    <div>
      <div class="ttl">Mozzafiato</div>
      <div class="sub" id="topSub">Tareas</div>
    </div>
    <div class="spacer"></div>
    <div class="chip"><span id="userChip">—</span><button onclick="App.logout()" title="Salir">⏻</button></div>
  </header>

  <main id="view" class="container"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="hoy" class="active"><span class="ic">✅</span>Hoy</button>
    <button data-tab="supervision"><span class="ic">📡</span>Supervisión</button>
    <button data-tab="tareas"><span class="ic">📋</span>Tareas</button>
    <button data-tab="evidencias"><span class="ic">📷</span>Evidencias</button>
    <button data-tab="reportes"><span class="ic">📊</span>Reportes</button>
    <button data-tab="equipo"><span class="ic">👥</span>Equipo</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="app.data.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN
   -------------------------------------------------------------------
   Para conectar el backend en la nube (Supabase), pega aquí tus 2 llaves.
   Mientras estén vacías, la app corre en MODO DEMO (datos en este
   dispositivo). Con las llaves puestas, sincroniza en tiempo real.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://ujmecfdsbqtwxusqqiqi.supabase.co',
  SUPABASE_KEY: 'sb_publishable_XY_anhqYY9rhgZau67wkcw_WkMx_PRA',
  NEGOCIO: 'Mozzafiato'
};
const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=> (crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2)+Date.now());
const pad = n=> String(n).padStart(2,'0');
const hoyISO = ()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fmtFecha = iso=>{const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FR_LABEL={1:'Diario',2:'Cada 2 días',3:'Cada 3 días',7:'Domingos',0:'Una vez'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function turnoActual(){return new Date().getHours()<15?'TM':'TV';}
function LSget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function LSset(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function LSdel(k){try{localStorage.removeItem(k);}catch(e){}}
function dueOn(fr,iso){
  if(fr===0) return false;
  const d=new Date(iso+'T12:00:00');
  if(fr===1) return true;
  if(fr===7) return d.getDay()===0;
  return ((d.getDate()-1)%fr)===0;
}
// --- Semana ---
const DIAS_CORTO=['D','L','M','M','J','V','S'];        // getDay 0..6
const DIAS_NOM=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_ORDEN=[1,2,3,4,5,6,0];                       // Lun..Dom
function isoOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
function lunesDe(iso){const d=new Date(iso+'T12:00:00');const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return isoOf(d);}
function semanaDe(iso){const lun=lunesDe(iso);return Array.from({length:7},(_,i)=>addDays(lun,i));} // Lun..Dom
function extraDueOn(e,iso){ if(e.dias&&e.dias.length){return e.dias.includes(new Date(iso+'T12:00:00').getDay());} return e.fecha===iso; }

/* =====================================================================
   CAPA DE DATOS  (misma interfaz para DEMO y NUBE)
   ===================================================================== */
const LS='mozza_v1';
const Store = {
  sb:null,
  async init(){
    if(CLOUD){
      await this._loadSB();
      this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
      // Sincronización en vivo: re-render de la vista actual ante cualquier cambio
      try{ this.sb.channel('mozza-rt').on('postgres_changes',{event:'*',schema:'public'},()=>{
        if(window.App&&App.user&&!document.getElementById('modalRoot').innerHTML){ clearTimeout(App._rtT); App._rtT=setTimeout(()=>App.refresh(),400); }
      }).subscribe(); }catch(e){}
    } else {
      this._d = JSON.parse(LSget(LS)||'null');
      if(!this._d){
        this._d = {
          colaboradores: SEED.colaboradores.map(c=>({...c})),
          catalogo: SEED.catalogo.map((c,i)=>({id:'cat_'+i, ...c})),
          extras: [],
          completions: [],
          evidencias: [],
          grupos: [],
          plantillas: []
        };
        this._save();
      }
      if(!this._d.grupos) this._d.grupos=[];
      if(!this._d.plantillas) this._d.plantillas=[];
    }
  },
  _save(){ if(!CLOUD) LSset(LS, JSON.stringify(this._d)); },
  _loadSB(){ return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=res;s.onerror=rej;document.head.appendChild(s);}); },
  // Mapeo camelCase (app) <-> snake_case (columnas de la base)
  _toDB(o){ const r={}; for(const k in o) r[k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())]=o[k]; return r; },
  _fromDB(o){ if(!o||typeof o!=='object') return o; const r={}; for(const k in o) r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=o[k]; return r; },
  _rows(a){ return (a||[]).map(x=>this._fromDB(x)); },

  /* ---- Colaboradores ---- */
  async colaboradores(){
    if(CLOUD){const {data}=await this.sb.from('colaboradores').select('*').order('nombre');return this._rows(data);}
    return this._d.colaboradores;
  },
  async saveColaborador(c){
    if(!c.id) c.id=uid();
    if(CLOUD){await this.sb.from('colaboradores').upsert(this._toDB(c));return c;}
    const i=this._d.colaboradores.findIndex(x=>x.id===c.id);
    if(i<0) this._d.colaboradores.push(c); else this._d.colaboradores[i]=c;
    this._save();return c;
  },
  async deleteColaborador(id){
    if(CLOUD){await this.sb.from('colaboradores').delete().eq('id',id);return;}
    this._d.colaboradores=this._d.colaboradores.filter(x=>x.id!==id);this._save();
  },

  /* ---- Catálogo ---- */
  async catalogo(){
    if(CLOUD){const {data}=await this.sb.from('catalogo').select('*');return this._rows(data);}
    return this._d.catalogo;
  },
  async saveCatalogo(item){
    if(!item.id) item.id=uid();
    if(CLOUD){await this.sb.from('catalogo').upsert(this._toDB(item));return item;}
    const i=this._d.catalogo.findIndex(x=>x.id===item.id);
    if(i<0) this._d.catalogo.push(item); else this._d.catalogo[i]=item;
    this._save();return item;
  },
  async deleteCatalogo(id){
    if(CLOUD){await this.sb.from('catalogo').delete().eq('id',id);return;}
    this._d.catalogo=this._d.catalogo.filter(x=>x.id!==id);this._save();
  },

  /* ---- Extras (tareas puntuales) ---- */
  async extras(){
    if(CLOUD){const {data}=await this.sb.from('extras').select('*').order('fecha');return this._rows(data);}
    return this._d.extras;
  },
  async saveExtra(t){
    if(!t.id) t.id=uid();
    if(CLOUD){await this.sb.from('extras').upsert(this._toDB(t));return t;}
    const i=this._d.extras.findIndex(x=>x.id===t.id);
    if(i<0) this._d.extras.push(t); else this._d.extras[i]=t;
    this._save();return t;
  },
  async deleteExtra(id){
    if(CLOUD){await this.sb.from('extras').delete().eq('id',id);return;}
    this._d.extras=this._d.extras.filter(x=>x.id!==id);this._save();
  },

  /* ---- Completions ---- */
  async completions(){
    if(CLOUD){const {data}=await this.sb.from('completions').select('*');return this._rows(data);}
    return this._d.completions;
  },
  async setCompletion(rec, on){
    // rec: {ref, tipo:'cat'|'extra', area, fecha, turno, colaboradorId, colaboradorNombre}
    const key=`${rec.tipo}:${rec.ref}:${rec.fecha}:${rec.turno}`;
    if(CLOUD){
      if(on){await this.sb.from('completions').upsert(this._toDB({...rec,key,ts:Date.now()}),{onConflict:'key'});}
      else {await this.sb.from('completions').delete().eq('key',key);}
      return;
    }
    this._d.completions=this._d.completions.filter(c=>c.key!==key);
    if(on) this._d.completions.push({...rec,key,ts:Date.now()});
    this._save();
  },

  /* ---- Evidencias ---- */
  async evidencias(){
    if(CLOUD){const {data}=await this.sb.from('evidencias').select('*').order('ts',{ascending:false});return this._rows(data);}
    return [...this._d.evidencias].sort((a,b)=>b.ts-a.ts);

  async addEvidencia(ev){
    ev.id=uid();ev.ts=Date.now();
    if(CLOUD){await this.sb.from('evidencias').insert(this._toDB(ev));return ev;}
    this._d.evidencias.push(ev);
    // límite para no llenar el almacenamiento del dispositivo en demo
    if(this._d.evidencias.length>120) this._d.evidencias=this._d.evidencias.slice(-120);
    this._save();return ev;
  },
  async deleteEvidencia(id){
    if(CLOUD){await this.sb.from('evidencias').delete().eq('id',id);return;}
    this._d.evidencias=this._d.evidencias.filter(x=>x.id!==id);this._save();
  },

  /* ---- Grupos de trabajo (asignaciones) ---- */
  async grupos(){
    if(CLOUD){const {data}=await this.sb.from('grupos').select('*').order('nombre');return this._rows(data).map(g=>({...g, items: g.items||[]}));}
    return this._d.grupos;
  },
  async saveGrupo(g){
    if(!g.id) g.id=uid();
    if(CLOUD){await this.sb.from('grupos').upsert(this._toDB(g));return g;}
    const i=this._d.grupos.findIndex(x=>x.id===g.id);
    if(i<0) this._d.grupos.push(g); else this._d.grupos[i]=g;
    this._save();return g;
  },
  async deleteGrupo(id){
    if(CLOUD){await this.sb.from('grupos').delete().eq('id',id);return;}
    this._d.grupos=this._d.grupos.filter(x=>x.id!==id);this._save();
  },

  /* ---- Plantillas de asignación (roles) ---- */
  async plantillas(){
    if(CLOUD){const {data}=await this.sb.from('plantillas').select('*').order('nombre');return this._rows(data).map(p=>({...p, mapa:p.mapa||{}}));}
    return this._d.plantillas;
  },
  async savePlantilla(p){
    if(!p.id) p.id=uid();
    if(CLOUD){await this.sb.from('plantillas').upsert(this._toDB(p));return p;}
    const i=this._d.plantillas.findIndex(x=>x.id===p.id);
    if(i<0) this._d.plantillas.push(p); else this._d.plantillas[i]=p;
    this._save();return p;
  },
  async deletePlantilla(id){
    if(CLOUD){await this.sb.from('plantillas').delete().eq('id',id);return;}
    this._d.plantillas=this._d.plantillas.filter(x=>x.id!==id);this._save();
  }
};

/* =====================================================================
   BANDEJA DE ENVÍO (IndexedDB) — guarda fotos localmente hasta enviarlas.
   Sobrevive a cerrar la app por accidente.
   ===================================================================== */
const Outbox = {
  _db:null,
  _open(){ if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{ const r=indexedDB.open('mozza_outbox',1);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('fotos')) r.result.createObjectStore('fotos',{keyPath:'id'}); };
      r.onsuccess=()=>{ this._db=r.result; res(this._db); };
      r.onerror=()=>rej(r.error); }); },
  async add(item){ const db=await this._open(); return new Promise((res,rej)=>{ const tx=db.transaction('fotos','readwrite'); tx.objectStore('fotos').put(item); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async all(){ try{ const db=await this._open(); return await new Promise((res,rej)=>{ const tx=db.transaction('fotos','readonly'); const rq=tx.objectStore('fotos').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }catch(e){ return []; } },
  async del(ids){ const db=await this._open(); return new Promise((res,rej)=>{ const tx=db.transaction('fotos','readwrite'); const st=tx.objectStore('fotos'); ids.forEach(id=>st.delete(id)); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
};

  /* ---------- VISTA: HOY ---------- */
  async view_hoy(){
    const v=$('#view');
    const mgr=this.user.rol==='encargado';
    const [cat, comps, extras, grupos] = await Promise.all([Store.catalogo(),Store.completions(),Store.extras(),Store.grupos()]);
    const areas=SEED.areas;

    // mapa de asignaciones: catId -> grupo (para el área actual)
    const asign={};
    grupos.filter(g=>g.area===this.area).forEach(g=>(g.items||[]).forEach(cid=>{ if(!asign[cid]) asign[cid]=g; }));
    const turnoMatch=(gt,t)=> !gt || gt==='ambos' || gt===t;

    // ¿tiene el colaborador tareas asignadas en esta área?
    const tengoAsignadas = !mgr && Object.values(asign).some(g=>g.colaboradorId===this.user.id);
    // filtro: 'mis' | 'area'  (encargado siempre 'area')
    if(mgr) this.hoyFilter='area';
    else if(this.hoyFilter==null) this.hoyFilter = tengoAsignadas ? 'mis' : 'area';
    const soloMias = this.hoyFilter==='mis';

    const areaTabs = mgr ? `<div class="area-scroll" style="margin-bottom:12px">${
        areas.map(a=>`<button class="area-tab ${a.id===this.area?'active':''}" onclick="App.setArea('${a.id}')">${a.emoji} ${a.nombre}</button>`).join('')
      }</div>` : '';

    // filtro Mis tareas / Área para colaboradores con asignaciones
    const filtroHTML = (!mgr && tengoAsignadas) ? `
      <div class="turno-toggle" style="margin-bottom:12px">
        <button class="${soloMias?'active':''}" style="${soloMias?'background:var(--brand);color:#fff':''}" onclick="App.setHoyFilter('mis')">🙋 Mis tareas</button>
        <button class="${!soloMias?'active':''}" style="${!soloMias?'background:var(--brand);color:#fff':''}" onclick="App.setHoyFilter('area')">🧩 Toda el área</button>
      </div>` : '';

    let dueCat = cat.filter(c=>c.area===this.area && dueOn(c.fr,this.fecha));
    if(soloMias){
      dueCat = dueCat.filter(c=> asign[c.id] && asign[c.id].colaboradorId===this.user.id && turnoMatch(asign[c.id].turno,this.turno));
    }
    let todayExtras = extras.filter(e=>e.area===this.area && extraDueOn(e,this.fecha) && (!soloMias || (e.asignadoId===this.user.id && e.turno===this.turno)));

    const secciones={};
    dueCat.forEach(c=>{(secciones[c.seccion]=secciones[c.seccion]||[]).push(c);});

    const isDone=(tipo,ref)=>comps.some(x=>x.tipo===tipo&&x.ref===ref&&x.fecha===this.fecha&&x.turno===this.turno);
    const evOf=(tipo,ref)=>comps.find(x=>x.tipo===tipo&&x.ref===ref&&x.fecha===this.fecha&&x.turno===this.turno&&x.evid);

    let total=0,done=0;
    const ownerOf=c=>{const g=asign[c.id]; return g? g.colaboradorNombre : '';};

    let secHTML='';
    for(const s in secciones){
      const rows=secciones[s]; let sd=0;
      const rowsHTML=rows.map(c=>{const d=isDone('cat',c.id);total++;if(d)done++;if(d)sd++;
        return taskRow('cat',c,c.nombre,d,evOf('cat',c.id),(mgr?ownerOf(c):''));}).join('');
      const full=sd===rows.length;
      const key=this.area+'|'+this.turno+'|'+s;
      const open=this._openSecs.has(key);
      secHTML+=`<details class="sec" ${open?'open':''} ontoggle="App._toggleSec('${key.replace(/'/g,"\\'")}',this.open)">
        <summary><span style="flex:1">${esc(s)}</span><span class="cnt ${full?'full':''}">${sd}/${rows.length}</span><span class="chev">▸</span></summary>
        ${rowsHTML}</details>`;
    }

    let extrasHTML='';
    if(todayExtras.length){
      extrasHTML=`<div class="section-title">Tareas puntuales de hoy</div><div class="card">`+
        todayExtras.map(e=>{const d=isDone('extra',e.id);total++;if(d)done++;
          return taskRow('extra',e,e.nombre,d,evOf('extra',e.id), e.asignadoNombre||'');}).join('')+`</div>`;
    }

    const pct= total? Math.round(done/total*100):0;
    const emptyMsg = soloMias
      ? '<div class="empty"><div class="big">🎉</div>No tienes tareas asignadas para este turno.<br>Cambia a "Toda el área" para ver el resto.</div>'
      : '<div class="empty"><div class="big">🎉</div>No hay actividades programadas para hoy en esta área.</div>';

    // Bandeja de envío (fotos guardadas localmente, pendientes de mandar a WhatsApp)
    const outbox=(await Outbox.all()).filter(x=>x.colaboradorId===this.user.id);
    const obByArea={}; outbox.forEach(x=>{obByArea[x.area]=(obByArea[x.area]||0)+1;});
    const areasPend=SEED.areas.filter(a=>obByArea[a.id]);
    const sendBar = outbox.length ? `<div class="sendbar">${
      areasPend.map(a=>`<button onclick="App.sendOutboxArea('${a.id}')">📲 Enviar ${a.nombre} · ${obByArea[a.id]} foto${obByArea[a.id]>1?'s':''}</button>`).join('')
    }</div>` : '';
    const spacer = 24 + areasPend.length*58;

    v.innerHTML=`
      ${areaTabs}
      <div class="card" style="padding:14px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div><b style="font-size:15px">${soloMias?'Mis tareas':areaName(this.area)}</b><div class="muted" style="font-size:12px">${diaTexto(this.fecha)}</div></div>
          <div style="text-align:right"><div style="font-weight:800;font-size:20px">${done}/${total}</div><div class="muted" style="font-size:11px">completadas</div></div>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <div class="turno-toggle" style="margin:12px 0">
        <button data-t="TM" class="${this.turno==='TM'?'active':''}" onclick="App.setTurno('TM')">☀️ Turno mañana</button>
        <button data-t="TV" class="${this.turno==='TV'?'active':''}" onclick="App.setTurno('TV')">🌙 Turno tarde</button>
      </div>
      ${outbox.length?`<div class="banner" style="margin-bottom:12px">📸 Tienes <b>${outbox.length}</b> evidencia(s) guardada(s) en la bandeja. Cuando termines, usa el botón verde para enviarlas por área.</div>`:''}
      ${filtroHTML}
      ${extrasHTML}
      <div class="section-title">${soloMias?'Mis actividades':'Checklist · '+areaName(this.area)}</div>
      <div class="card">${secHTML||emptyMsg}</div>
      ${mgr?`<button class="btn ghost" style="margin-top:14px" onclick="App.modalNuevaTarea()">＋ Asignar tarea puntual</button>`:''}
      <div style="height:${spacer}px"></div>
      ${sendBar}`;
  },
  setArea(a){this.area=a;this.view_hoy();},
  setTurno(t){this.turno=t;this.view_hoy();},
  setHoyFilter(f){this.hoyFilter=f;this.view_hoy();},
  _toggleSec(key,open){ if(open) this._openSecs.add(key); else this._openSecs.delete(key); },

  async toggle(tipo,ref){

    const item = tipo==='cat'? cat.find(c=>c.id===ref) : extras.find(e=>e.id===ref);

  /* Foto de evidencia */
  async foto(tipo,ref){
    const [cat,extras]=await Promise.all([Store.catalogo(),Store.extras()]);
    const item = tipo==='cat'? cat.find(c=>c.id===ref) : extras.find(e=>e.id===ref);
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.capture='environment';
    inp.onchange=async()=>{
      const file=inp.files[0]; if(!file) return;
      toast('Procesando foto…');
      const horaSello=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      const stampLines=[
        `${CONFIG.NEGOCIO} · ${areaName(item.area)}`,
        item.nombre,
        `${this.user.nombre} · ${fmtFecha(this.fecha)} ${horaSello} · ${this.turno==='TM'?'Mañana':'Tarde'}`
      ];
      const {thumb, full} = await procesarImagen(file, stampLines);
      const caption = captionFor(item, this.fecha, this.turno, this.user.nombre);
      // 1) guardar evidencia (miniatura) en la galería/reportes + marcar completada
      await Store.addEvidencia({
        tipo, ref, area:item.area, tarea:item.nombre, seccion:item.seccion||'',
        fecha:this.fecha, turno:this.turno,
        colaboradorId:this.user.id, colaboradorNombre:this.user.nombre,
        img:thumb, caption
      });
      await Store.setCompletion({tipo,ref,area:item.area,fecha:this.fecha,turno:this.turno,
        colaboradorId:this.user.id,colaboradorNombre:this.user.nombre,nombre:item.nombre,evid:true}, true);
      // 2) guardar la foto en la BANDEJA local (NO se envía todavía)
      const hora=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      const blob = (full instanceof Blob) ? full : file;   // 'full' es un File comprimido (~1600px)
      await Outbox.add({ id:uid(), area:item.area, tarea:item.nombre, seccion:item.seccion||'',
        fecha:this.fecha, turno:this.turno, colaboradorId:this.user.id, colaboradorNombre:this.user.nombre,
        caption, hora, blob, ts:Date.now() });
      toast('✅ Guardada en la bandeja — toca "Enviar" cuando termines');
      this.view_hoy();
    };
    inp.click();
  },

  /* Enviar el lote de un área a WhatsApp (una vez por área) */
  async sendOutboxArea(area){
    const items=(await Outbox.all()).filter(x=>x.area===area && x.colaboradorId===this.user.id);
    if(!items.length){ toast('No hay evidencias de esa área'); return; }
    const files=items.map(x=>new File([x.blob], `evidencia_${x.id}.jpg`, {type:(x.blob&&x.blob.type)||'image/jpeg'}));
    const lineas=items.map((x,i)=>`${i+1}. ${x.tarea} · ${x.turno==='TM'?'AM':'PM'} · ${x.hora}`).join('\n');
    const msg=`🧾 *${CONFIG.NEGOCIO} · ${areaName(area)}* — Evidencias ${fmtFecha(items[0].fecha)}\n👤 ${items[0].colaboradorNombre}\n\n${lineas}`;
    let sent=false;
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, text:msg, title:`Evidencias ${areaName(area)}`}); sent=true; }
      catch(e){ if(e&&e.name==='AbortError'){ toast('Envío cancelado'); return; } }
    }
    if(!sent){ // fallback: copiar texto y abrir WhatsApp (adjuntas las fotos manual)
      try{ await navigator.clipboard.writeText(msg); }catch(e){}
      toast('Copié el texto — adjunta las fotos en WhatsApp');
      window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); sent=true;
    }
    if(sent){ await Outbox.del(items.map(x=>x.id)); toast(`Enviadas ${items.length} de ${areaName(area)}`); }
    this.view_hoy();
  },

    // --- Grupos del área ---
    const gArea=grupos.filter(g=>g.area===this.area);
    const gruposHTML = gArea.length ? gArea.map(g=>`
      <div class="task">
        <div class="body">
          <div class="name">${esc(g.nombre)}</div>

            <span class="pill" style="background:#eef4f3;color:var(--brand2)">👤 ${esc((g.colaboradorNombre||'Sin asignar').split(' ')[0])}</span>

      </div>`).join('') : '<div class="empty" style="padding:22px">Aún no hay grupos. Crea uno para repartir actividades entre tu equipo.</div>';

    // --- Plantillas (roles) ---
    const plHTML = plantillas.length ? plantillas.map(p=>`
      <div class="task">
        <div class="body"><div class="name">${esc(p.nombre)}</div>
          <div class="meta"><span class="pill fr">${Object.keys(p.mapa||{}).length} grupos</span></div></div>

  async _renderDesempeno(mes,anio){
    const [comps,cols,cat]=await Promise.all([Store.completions(),Store.colaboradores(),Store.catalogo()]);
    const inMonth=c=>{const [y,m]=c.fecha.split('-');return +y===anio && (+m-1)===mes && c.area===this.area;};
    const cm=comps.filter(inMonth);
    // slots esperados en el mes para el área
    const dim=new Date(anio,mes+1,0).getDate();
    let esperado=0;
    cat.filter(c=>c.area===this.area).forEach(c=>{
      for(let day=1;day<=dim;day++){const iso=`${anio}-${pad(mes+1)}-${pad(day)}`;if(dueOn(c.fr,iso)) esperado+=2;}
    });
    const porCol={};
    cm.forEach(c=>{porCol[c.colaboradorNombre||'—']=(porCol[c.colaboradorNombre||'—']||0)+1;});
    const filas=Object.entries(porCol).sort((a,b)=>b[1]-a[1]);
    const totalHechas=cm.length;
    const pctArea=esperado?Math.round(totalHechas/esperado*100):0;
    const el=$('#repDesempeno');if(!el)return;
    el.innerHTML=`
      <div class="stat"><div><b>Cumplimiento del área</b><div class="muted" style="font-size:12px">${totalHechas} de ~${esperado} casillas del mes</div><div class="bar"><i style="width:${Math.min(pctArea,100)}%"></i></div></div><div class="num">${pctArea}%</div></div>
      ${filas.length?filas.map(([n,c])=>`<div class="stat"><div>${esc(n)}</div><div class="num">${c}</div></div>`).join(''):'<div class="empty">Sin registros este mes</div>'}`;
  },

  async genBitacora(){
    toast('Generando imagen…');
    const d=new Date();const mes=this._repMes??d.getMonth();const anio=this._repAnio??d.getFullYear();
    const [comps,cat]=await Promise.all([Store.completions(),Store.catalogo()]);
    const canvas=dibujarBitacora(this.area,mes,anio,cat,comps);
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const nombre=`Bitacora_${areaName(this.area)}_${MESES[mes]}_${anio}.png`;
      Modal.open(`
        <h2>Bitácora ${areaName(this.area)}</h2>
        <div class="muted" style="font-size:13px;margin-bottom:10px">${MESES[mes]} ${anio} · ${canvas.width}×${canvas.height}px</div>
        <img src="${url}" style="width:100%;border:1px solid var(--line);border-radius:10px">
        <a class="btn" style="margin-top:12px;text-decoration:none" href="${url}" download="${nombre}">⬇️ Descargar imagen UHD</a>
        <button class="btn gold" style="margin-top:10px" onclick="App.compartirBitacora('${url}','${nombre}')">📲 Compartir</button>`);
    },'image/png');
  },
  async compartirBitacora(url,nombre){
    const blob=await(await fetch(url)).blob();
    const file=new File([blob],nombre,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:nombre});}catch(e){}
    } else { toast('Usa el botón Descargar y adjúntala en WhatsApp'); }
  },
  async genPDF(){
    toast('Generando PDF…');
    const d=new Date();const mes=this._repMes??d.getMonth();const anio=this._repAnio??d.getFullYear();
    const [comps,cat]=await Promise.all([Store.completions(),Store.catalogo()]);
    const canvas=dibujarBitacora(this.area,mes,anio,cat,comps);
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const img=canvas.toDataURL('image/png');
    const ratio=Math.min(pw/canvas.width,ph/canvas.height);
    const w=canvas.width*ratio,h=canvas.height*ratio;
    pdf.addImage(img,'PNG',(pw-w)/2,(ph-h)/2,w,h);
    pdf.save(`Bitacora_${areaName(this.area)}_${MESES[mes]}_${anio}.pdf`);
  },

  setSupMode(m){this.supMode=m;this.view_supervision();},

  semanaNav(n){this.semanaRef=addDays(this.semanaRef||this.fecha,n*7);this.view_supervision();},
  async view_supervision(){
    this.supMode=this.supMode||'hoy';
    const toggle=`<div class="turno-toggle" style="margin-bottom:12px">
      <button class="${this.supMode==='hoy'?'active':''}" style="${this.supMode==='hoy'?'background:var(--brand);color:#fff':''}" onclick="App.setSupMode('hoy')">📍 Hoy</button>
      <button class="${this.supMode==='semana'?'active':''}" style="${this.supMode==='semana'?'background:var(--brand);color:#fff':''}" onclick="App.setSupMode('semana')">🗓️ Semana</button>
    </div>`;
    if(this.supMode==='semana') return this._viewSemana(toggle);

    const v=$('#view'); const today=this.fecha;
    const [cat,comps,grupos,extras,cols]=await Promise.all([Store.catalogo(),Store.completions(),Store.grupos(),Store.extras(),Store.colaboradores()]);
    const nowT=turnoActual();
    const doneSet=new Set(comps.filter(c=>c.fecha===today).map(c=>`${c.tipo}:${c.ref}:${c.turno}`));
    const isDone=(tipo,ref,turno)=>doneSet.has(`${tipo}:${ref}:${turno}`);
    const overdue=(turno,done)=> !done && turno==='TM' && nowT==='TV';

    const areasHTML=SEED.areas.map(a=>{
      const due=cat.filter(c=>c.area===a.id && dueOn(c.fr,today));
      let total=0,done=0,late=0;
      due.forEach(c=>['TM','TV'].forEach(t=>{total++;const d=isDone('cat',c.id,t);if(d)done++;else if(overdue(t,d))late++;}));
      extras.filter(e=>e.area===a.id&&extraDueOn(e,today)).forEach(e=>{total++;const d=isDone('extra',e.id,e.turno);if(d)done++;else if(overdue(e.turno,d))late++;});
      const pct=total?Math.round(done/total*100):0;
      return `<div class="card" style="padding:14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>${a.emoji} ${a.nombre}</b><span class="num">${done}/${total}</span></div>
        <div class="progress" style="margin:8px 0 6px"><i style="width:${pct}%"></i></div>
        <div style="font-size:12px;color:var(--muted)">${total-done} pendientes${late?` · <span style="color:var(--warn);font-weight:800">⚠ ${late} atrasadas</span>`:''}</div>
      </div>`;
    }).join('');

    const colabs=cols.filter(c=>c.rol==='colaborador');
    const asignByCol={};
    grupos.forEach(g=>{(g.items||[]).forEach(cid=>{ (asignByCol[g.colaboradorId]=asignByCol[g.colaboradorId]||[]).push({cid,turno:g.turno}); });});
    const catById={};cat.forEach(c=>catById[c.id]=c);
    const colHTML=colabs.map(col=>{
      let total=0,done=0,late=0;
      (asignByCol[col.id]||[]).forEach(({cid,turno})=>{
        const c=catById[cid]; if(!c||!dueOn(c.fr,today))return;
        (turno==='ambos'?['TM','TV']:[turno]).forEach(t=>{total++;const d=isDone('cat',cid,t);if(d)done++;else if(overdue(t,d))late++;});
      });
      extras.filter(e=>e.asignadoId===col.id&&extraDueOn(e,today)).forEach(e=>{total++;const d=isDone('extra',e.id,e.turno);if(d)done++;else if(overdue(e.turno,d))late++;});
      const pct=total?Math.round(done/total*100):0;
      return `<div class="stat">
        <div style="flex:1">
          <b>${esc(col.nombre)}</b> <span class="muted" style="font-size:12px">${col.area?'· '+areaName(col.area):''}</span>
          <div class="bar" style="margin-top:6px"><i style="width:${pct}%;${late?'background:var(--warn)':''}"></i></div>
          <div class="muted" style="font-size:11.5px;margin-top:3px">${total?`${done}/${total} de sus tareas${late?` · <span style="color:var(--warn);font-weight:700">${late} atrasadas</span>`:''}`:'sin tareas asignadas hoy'}</div>
        </div>
        <div class="num">${total?pct+'%':'—'}</div>
      </div>`;
    }).join('');

    v.innerHTML=`${toggle}
      <div class="section-title" style="margin-top:6px">Hoy por área · ${diaTexto(today)}</div>
      ${areasHTML}
      <div class="section-title">Por colaborador</div>
      <div class="card">${colHTML||'<div class="empty">Sin colaboradores</div>'}</div>
      <div class="muted" style="font-size:11.5px;text-align:center;margin-top:12px">📡 Se actualiza solo en tiempo real</div>
      <div style="height:20px"></div>`;
  },

  async _viewSemana(toggle){
    const v=$('#view');
    this.supEnfoque=this.supEnfoque||'area';
    this.semanaRef=this.semanaRef||this.fecha;
    const dias=semanaDe(this.semanaRef);
    const [cat,comps,grupos,extras,cols]=await Promise.all([Store.catalogo(),Store.completions(),Store.grupos(),Store.extras(),Store.colaboradores()]);
    const doneSet=new Set(comps.map(c=>`${c.tipo}:${c.ref}:${c.fecha}:${c.turno}`));
    const isDone=(tipo,ref,iso,turno)=>doneSet.has(`${tipo}:${ref}:${iso}:${turno}`);
    const catById={};cat.forEach(c=>catById[c.id]=c);
    const asignByCol={};grupos.forEach(g=>(g.items||[]).forEach(cid=>{(asignByCol[g.colaboradorId]=asignByCol[g.colaboradorId]||[]).push({cid,turno:g.turno});}));

    const areaDia=(area,iso)=>{let total=0,done=0;
      cat.filter(c=>c.area===area&&dueOn(c.fr,iso)).forEach(c=>['TM','TV'].forEach(t=>{total++;if(isDone('cat',c.id,iso,t))done++;}));
      extras.filter(e=>e.area===area&&extraDueOn(e,iso)).forEach(e=>{total++;if(isDone('extra',e.id,iso,e.turno))done++;});
      return {total,done};};
    const colDia=(col,iso)=>{let total=0,done=0;
      (asignByCol[col.id]||[]).forEach(({cid,turno})=>{const c=catById[cid];if(!c||!dueOn(c.fr,iso))return;(turno==='ambos'?['TM','TV']:[turno]).forEach(t=>{total++;if(isDone('cat',cid,iso,t))done++;});});
      extras.filter(e=>e.asignadoId===col.id&&extraDueOn(e,iso)).forEach(e=>{total++;if(isDone('extra',e.id,iso,e.turno))done++;});
      return {total,done};};

    const cell=(iso,r)=>{const pct=r.total?Math.round(r.done/r.total*100):0;const hoy=iso===this.fecha;
      const bg=r.total===0?'var(--line)':pct===100?'var(--ok)':pct>0?'#8fd3ad':'var(--warnbg)';
      const col=pct>0?'#0a3a22':(r.total?'var(--warn)':'var(--muted)');const d=new Date(iso+'T12:00:00');
      return `<div style="flex:1;text-align:center">
        <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${DIAS_CORTO[d.getDay()]}</div>
        <div style="height:36px;border-radius:8px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:${col};${hoy?'outline:2px solid var(--brand);outline-offset:-2px':''}">${r.total?r.done+'/'+r.total:'–'}</div>
      </div>`;};

    const enfoqueToggle=`<div class="turno-toggle" style="margin-bottom:12px">
      <button class="${this.supEnfoque==='area'?'active':''}" style="${this.supEnfoque==='area'?'background:var(--brand);color:#fff':''}" onclick="App.setSupEnfoque('area')">🧩 Por área</button>
      <button class="${this.supEnfoque==='persona'?'active':''}" style="${this.supEnfoque==='persona'?'background:var(--brand);color:#fff':''}" onclick="App.setSupEnfoque('persona')">🙋 Por persona</button>
    </div>`;

/* =====================================================================
   IMÁGENES: compresión + compartir WhatsApp
   ===================================================================== */
function procesarImagen(file, stampLines){
  return new Promise(res=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      // full: reescala a máx 1600px + sello de datos, para envío/gallería
      const full=escala(img,1600,.9,stampLines);
      const thumb=escala(img,640,.72,stampLines);
      URL.revokeObjectURL(url);
      fetch(full).then(r=>r.blob()).then(b=>{
        res({thumb, full:new File([b],'evidencia.jpg',{type:'image/jpeg'})});
      });
    };
    img.src=url;
  });
}
function _fitText(x,text,maxW){ text=String(text||''); if(x.measureText(text).width<=maxW) return text;
  let t=text; while(t.length>1 && x.measureText(t+'…').width>maxW) t=t.slice(0,-1); return t+'…'; }
function escala(img,max,q,stampLines){
  let {width:w,height:h}=img;
  if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.drawImage(img,0,0,w,h);
  // Sello de datos incrustado en la foto (fecha, empleado, tarea, área)
  if(stampLines && stampLines.length){
    const fs=Math.max(12,Math.round(w*0.030));
    const pad=Math.round(fs*0.6), lh=Math.round(fs*1.35);
    const barH=pad*2+lh*stampLines.length;
    x.fillStyle='rgba(10,20,18,0.58)'; x.fillRect(0,h-barH,w,barH);
    x.fillStyle='#c8a24a'; x.fillRect(0,h-barH,Math.max(4,Math.round(w*0.014)),barH);
    const tx=pad+Math.round(w*0.02), maxW=w-tx-pad;
    x.textBaseline='middle'; x.textAlign='left';
    stampLines.forEach((ln,i)=>{
      x.font=(i===0?'700 ':'')+fs+'px -apple-system,Arial,sans-serif';
      x.fillStyle=i===0?'#ffe4a3':'#f2f5f2';
      x.fillText(_fitText(x,ln,maxW), tx, h-barH+pad+lh*i+lh/2);
    });
  }
  return c.toDataURL('image/jpeg',q);
}
async function compartirWhatsApp(file,caption,fname){
  // 1) Web Share con archivo (mejor experiencia: comparte la FOTO)
  if(navigator.canShare && file && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],text:caption,title:'Evidencia Mozzafiato'}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  // 2) Fallback: copiar texto y abrir WhatsApp (el usuario adjunta la foto)
  try{ await navigator.clipboard.writeText(caption); }catch(e){}
  toast('Texto copiado. Se abrirá WhatsApp — adjunta la foto.');
  setTimeout(()=>{ window.open('https://wa.me/?text='+encodeURIComponent(caption),'_blank'); },600);
}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

/* =====================================================================
   DIBUJAR BITÁCORA MENSUAL (canvas UHD)
   ===================================================================== */
function dibujarBitacora(area,mes,anio,cat,comps){
  const items=cat.filter(c=>c.area===area);
  const dim=new Date(anio,mes+1,0).getDate();
  // dimensiones
  const S=2; // escala UHD
  const colName=380, colFr=70, dayW=64, rowH=26, headH=64, titleH=90, secH=26;
  // contar filas (secciones + items)
  const secciones={};items.forEach(c=>{(secciones[c.seccion]=secciones[c.seccion]||[]).push(c);});
  let rows=0;for(const s in secciones){rows+=1+secciones[s].length;}
  const gridW=colName+colFr+dim*dayW;
  const W=(gridW)*S, H=(titleH+headH+rows*rowH+40)*S;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');x.scale(S,S);
  x.fillStyle='#ffffff';x.fillRect(0,0,gridW,H/S);
  x.textBaseline='middle';

  // título
  x.fillStyle='#12403f';x.font='bold 30px -apple-system,Arial';
  x.fillText('Mozzafiato', 20, 34);
  x.font='bold 20px Arial';x.fillStyle='#1c2622';
  x.fillText(`Bitácora de limpieza · ${areaName(area)}`, 20, 62);
  x.font='16px Arial';x.fillStyle='#6b7770';
  x.textAlign='right';x.fillText(`${MESES[mes]} ${anio}`, gridW-20, 50);x.textAlign='left';

  let y=titleH;
  // encabezado días
  x.fillStyle='#12403f';x.fillRect(0,y,gridW,headH);
  x.fillStyle='#fff';x.font='bold 13px Arial';
  x.fillText('Actividad', 10, y+headH/2);
  x.textAlign='center';x.fillText('FR', colName+colFr/2, y+headH/2);
  for(let dnum=1;dnum<=dim;dnum++){
    const dx=colName+colFr+(dnum-1)*dayW;
    x.fillText(dnum, dx+dayW/2, y+16);
    x.font='9px Arial';x.fillText('TM  TV', dx+dayW/2, y+44);x.font='bold 13px Arial';
  }
  x.textAlign='left';
  y+=headH;

  const isDone=(ref,iso,turno)=>comps.some(c=>c.ref===ref&&c.fecha===iso&&c.turno===turno);
  const hasEv=(ref,iso,turno)=>comps.some(c=>c.ref===ref&&c.fecha===iso&&c.turno===turno&&c.evid);

  let r=0;
  for(const s in secciones){
    // fila de sección
    x.fillStyle='#e9efee';x.fillRect(0,y,gridW,secH);
    x.fillStyle='#12403f';x.font='bold 12px Arial';x.fillText(s.toUpperCase(),10,y+secH/2);
    y+=secH;
    for(const it of secciones[s]){
      const zebra=(r%2===0);
      x.fillStyle=zebra?'#ffffff':'#f7f5f0';x.fillRect(0,y,gridW,rowH);
      x.fillStyle='#1c2622';x.font='12px Arial';
      const nm=it.nombre.length>52?it.nombre.slice(0,50)+'…':it.nombre;
      x.fillText(nm,10,y+rowH/2);
      x.textAlign='center';x.fillStyle='#6b7770';x.font='bold 11px Arial';
      x.fillText(String(it.fr),colName+colFr/2,y+rowH/2);
      // días
      for(let dnum=1;dnum<=dim;dnum++){
        const iso=`${anio}-${pad(mes+1)}-${pad(dnum)}`;
        const due=dueOn(it.fr,iso);
        const dx=colName+colFr+(dnum-1)*dayW;
        // celda TM / TV
        [['TM',0],['TV',dayW/2]].forEach(([t,off])=>{
          const cx=dx+off;
          if(!due){x.fillStyle='#eceae4';x.fillRect(cx+1,y+1,dayW/2-2,rowH-2);}
          else if(isDone(it.id,iso,t)){
            x.fillStyle=hasEv(it.id,iso,t)?'#1f9d63':'#8fd3ad';
            x.fillRect(cx+1,y+1,dayW/2-2,rowH-2);
            x.fillStyle='#fff';x.font='bold 12px Arial';x.fillText('✓',cx+dayW/4,y+rowH/2);
          }
        });
        x.font='bold 11px Arial';
      }
      x.textAlign='left';
      // líneas verticales de las celdas
      y+=rowH;r++;
    }
  }
  // rejilla
  x.strokeStyle='#d8d3c7';x.lineWidth=.5;
  const top=titleH+headH;
  for(let dnum=0;dnum<=dim;dnum++){const gx=colName+colFr+dnum*dayW;x.beginPath();x.moveTo(gx,titleH);x.lineTo(gx,y);x.stroke();
    if(dnum<dim){const mid=gx+dayW/2;x.strokeStyle='#ece8df';x.beginPath();x.moveTo(mid,top);x.lineTo(mid,y);x.stroke();x.strokeStyle='#d8d3c7';}}
  x.beginPath();x.moveTo(colName,titleH);x.lineTo(colName,y);x.stroke();
  x.beginPath();x.moveTo(colName+colFr,titleH);x.lineTo(colName+colFr,y);x.stroke();
  // leyenda
  x.font='11px Arial';x.fillStyle='#6b7770';
  x.fillText('✓ verde fuerte = con foto de evidencia · ✓ verde claro = completada · gris = no programado ese día', 10, y+18);
  return cv;
}

      <div class="modal"><div class="grab"></div>${html}</div></div>`;
  },
  close(){$('#modalRoot').innerHTML='';}
};

App.start();
